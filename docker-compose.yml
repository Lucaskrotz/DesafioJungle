services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      # só fica healthy depois que o init criou as filas
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events.fifo"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Réplicas da aplicação (docker compose --profile app up --scale app=3)
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager
      SQS_ENDPOINT: http://localstack:4566
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
    ports:
      - "3000-3010:3000"
